<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommentGuard 🛡️</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }
  .hero { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 3rem 2rem; text-align: center; border-bottom: 1px solid #333; }
  .hero h1 { font-size: 2.8rem; margin-bottom: .5rem; }
  .hero h1 span { color: #ff0000; }
  .hero p { color: #aaa; font-size: 1.1rem; margin-bottom: 2rem; }
  .search-box { display: flex; gap: 1rem; max-width: 700px; margin: 0 auto; }
  .search-box input { flex: 1; padding: 1rem 1.5rem; border-radius: 12px; border: 2px solid #333; background: #1a1a1a; color: #fff; font-size: 1rem; outline: none; transition: border .2s; }
  .search-box input:focus { border-color: #ff0000; }
  .search-box button { padding: 1rem 2rem; background: #ff0000; color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all .2s; }
  .search-box button:hover { background: #cc0000; transform: scale(1.03); }
  .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.2rem; margin-bottom: 2rem; }
  .stat-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 1.5rem; text-align: center; transition: transform .2s; }
  .stat-card:hover { transform: translateY(-3px); }
  .stat-card .number { font-size: 2.5rem; font-weight: bold; margin-bottom: .3rem; }
  .stat-card .label { color: #888; font-size: .9rem; }
  .green { color: #00c853; }
  .red { color: #ff1744; }
  .orange { color: #ff9100; }
  .blue { color: #2979ff; }
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
  .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 1.5rem; }
  .card h3 { margin-bottom: 1rem; font-size: 1.1rem; color: #ccc; }
  .pin-card { background: linear-gradient(135deg, #1a2a1a, #0f1f0f); border: 1px solid #00c853; border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; }
  .pin-card h3 { color: #00c853; margin-bottom: 1rem; }
  .pin-text { font-size: 1.1rem; line-height: 1.6; margin-bottom: .8rem; }
  .pin-meta { color: #888; font-size: .85rem; }
  .comments-list { display: flex; flex-direction: column; gap: .8rem; }
  .comment-item { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 1rem 1.2rem; border-left: 4px solid #333; }
  .comment-item.spam { border-left-color: #ff9100; }
  .comment-item.toxic { border-left-color: #ff1744; }
  .comment-item.positive { border-left-color: #00c853; }
  .comment-item.negative { border-left-color: #ff1744; }
  .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
  .comment-author { font-weight: bold; font-size: .9rem; color: #aaa; }
  .badge { padding: .2rem .7rem; border-radius: 20px; font-size: .75rem; font-weight: bold; }
  .badge-spam { background: rgba(255,145,0,.2); color: #ff9100; }
  .badge-toxic { background: rgba(255,23,68,.2); color: #ff1744; }
  .badge-positive { background: rgba(0,200,83,.2); color: #00c853; }
  .badge-neutral { background: rgba(255,255,255,.1); color: #aaa; }
  .badge-negative { background: rgba(255,23,68,.15); color: #ff6b6b; }
  .comment-text { font-size: .95rem; line-height: 1.5; margin-bottom: .5rem; }
  .reply-template { background: #0d1117; border-radius: 8px; padding: .6rem 1rem; font-size: .82rem; color: #888; margin-top: .5rem; font-style: italic; }
  .loading { text-align: center; padding: 4rem; display: none; }
  .spinner { width: 50px; height: 50px; border: 4px solid #333; border-top: 4px solid #ff0000; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #results { display: none; }
  .error-msg { background: rgba(255,23,68,.1); border: 1px solid #ff1744; border-radius: 12px; padding: 1.2rem; color: #ff6b6b; text-align: center; margin: 2rem 0; display: none; }
  @media(max-width:768px) { .charts-grid { grid-template-columns: 1fr; } .hero h1 { font-size: 2rem; } .search-box { flex-direction: column; } }
</style>
</head>
<body>
<div class="hero">
  <h1>Comment<span>Guard</span> 🛡️</h1>
  <p>Analyze YouTube comments instantly — detect spam, toxicity & sentiment</p>
  <div class="search-box">
    <input type="text" id="urlInput" placeholder="Paste YouTube video URL here..." />
    <button onclick="analyze()">Analyze</button>
  </div>
</div>

<div class="container">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="color:#888">Fetching and analyzing comments...</p>
  </div>
  <div class="error-msg" id="errorMsg"></div>

  <div id="results">
    <div class="stats-grid">
      <div class="stat-card"><div class="number green" id="totalCount">0</div><div class="label">Total Comments</div></div>
      <div class="stat-card"><div class="number green" id="positiveCount">0%</div><div class="label">😊 Positive</div></div>
      <div class="stat-card"><div class="number orange" id="spamCount">0</div><div class="label">🚫 Spam Detected</div></div>
      <div class="stat-card"><div class="number red" id="toxicCount">0</div><div class="label">☠️ Toxic Comments</div></div>
    </div>

    <div class="pin-card" id="pinCard">
      <h3>📌 Best Comment to Pin</h3>
      <div class="pin-text" id="pinText"></div>
      <div class="pin-meta" id="pinMeta"></div>
    </div>

    <div class="charts-grid">
      <div class="card">
        <h3>💬 Sentiment Breakdown</h3>
        <canvas id="sentimentChart"></canvas>
      </div>
      <div class="card">
        <h3>🚨 Comment Health</h3>
        <canvas id="healthChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:1.2rem">📋 Comment Analysis <span style="color:#888;font-size:.85rem">(showing top 50)</span></h3>
      <div class="comments-list" id="commentsList"></div>
    </div>
  </div>
</div>

<script>
let sentimentChart, healthChart;

async function analyze() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { showError('Please paste a YouTube URL'); return; }

  document.getElementById('loading').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  document.getElementById('errorMsg').style.display = 'none';

  try {
    const res = await fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();
    document.getElementById('loading').style.display = 'none';
    if (data.error) { showError(data.error); return; }
    renderResults(data);
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    showError('Something went wrong. Please try again.');
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = '❌ ' + msg;
  el.style.display = 'block';
}

function renderResults(data) {
  document.getElementById('results').style.display = 'block';
  document.getElementById('totalCount').textContent = data.total;
  document.getElementById('positiveCount').textContent = data.sentiment_pct.positive + '%';
  document.getElementById('spamCount').textContent = data.spam_count;
  document.getElementById('toxicCount').textContent = data.toxic_count;

  if (data.best_pin) {
    document.getElementById('pinText').textContent = '"' + data.best_pin.text + '"';
    document.getElementById('pinMeta').textContent = '👤 ' + data.best_pin.author + ' · 👍 ' + data.best_pin.likes + ' likes';
  } else {
    document.getElementById('pinCard').style.display = 'none';
  }

  if (sentimentChart) sentimentChart.destroy();
  if (healthChart) healthChart.destroy();

  sentimentChart = new Chart(document.getElementById('sentimentChart'), {
    type: 'doughnut',
    data: {
      labels: ['😊 Positive', '😐 Neutral', '😡 Negative'],
      datasets: [{ data: [data.sentiment_pct.positive, data.sentiment_pct.neutral, data.sentiment_pct.negative], backgroundColor: ['#00c853', '#555', '#ff1744'], borderWidth: 0 }]
    },
    options: { plugins: { legend: { labels: { color: '#ccc' } } } }
  });

  healthChart = new Chart(document.getElementById('healthChart'), {
    type: 'bar',
    data: {
      labels: ['Clean', 'Spam', 'Toxic'],
      datasets: [{ data: [data.total - data.spam_count - data.toxic_count, data.spam_count, data.toxic_count], backgroundColor: ['#00c853', '#ff9100', '#ff1744'], borderRadius: 8 }]
    },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#888' } }, y: { ticks: { color: '#888' } } } }
  });

  const list = document.getElementById('commentsList');
  list.innerHTML = '';
  data.comments.forEach(c => {
    const type = c.spam ? 'spam' : c.toxic ? 'toxic' : c.sentiment;
    const badge = c.spam ? '<span class="badge badge-spam">🚫 SPAM</span>' : c.toxic ? '<span class="badge badge-toxic">☠️ TOXIC</span>' : c.sentiment === 'positive' ? '<span class="badge badge-positive">😊 Positive</span>' : c.sentiment === 'negative' ? '<span class="badge badge-negative">😡 Negative</span>' : '<span class="badge badge-neutral">😐 Neutral</span>';
    list.innerHTML += `
      <div class="comment-item ${type}">
        <div class="comment-header">
          <span class="comment-author">👤 ${c.author}</span>
          <div style="display:flex;gap:.5rem;align-items:center">${badge}<span style="color:#666;font-size:.8rem">👍 ${c.likes}</span></div>
        </div>
        <div class="comment-text">${c.text}</div>
        <div class="reply-template">💬 Suggested reply: ${c.reply_template}</div>
      </div>`;
  });
}

document.getElementById('urlInput').addEventListener('keypress', e => { if (e.key === 'Enter') analyze(); });
</script>
</body>
</html>
